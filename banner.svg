<svg viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" font-family="'Courier New', monospace">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e1a"/>
      <stop offset="50%" style="stop-color:#0d1b2e"/>
      <stop offset="100%" style="stop-color:#0a1628"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00d4ff"/>
      <stop offset="100%" style="stop-color:#0099cc"/>
    </linearGradient>
    <linearGradient id="orange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff9500"/>
      <stop offset="100%" style="stop-color:#ff6b00"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge><feMergeNode in="coloredBlur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="400" fill="url(#bg)"/>

  <!-- Grid lines -->
  <g opacity="0.06" stroke="#00d4ff" stroke-width="1">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
    <line x1="600" y1="0" x2="600" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1000" y1="0" x2="1000" y2="400"/>
  </g>

  <!-- Decorative circles -->
  <circle cx="950" cy="200" r="180" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.08"/>
  <circle cx="950" cy="200" r="140" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.06"/>
  <circle cx="950" cy="200" r="100" fill="none" stroke="#ff9500" stroke-width="1" opacity="0.1"/>
  <circle cx="950" cy="200" r="60" fill="none" stroke="#ff9500" stroke-width="1.5" opacity="0.15"/>
  <circle cx="950" cy="200" r="25" fill="#ff9500" opacity="0.08"/>

  <!-- Shield icon (center of circles) -->
  <g transform="translate(935, 182)" filter="url(#glow2)">
    <path d="M15 2 L28 7 L28 18 C28 25 21.5 31 15 33 C8.5 31 2 25 2 18 L2 7 Z" fill="none" stroke="#ff9500" stroke-width="2" opacity="0.9"/>
    <path d="M15 10 L20 13 L18 20 L15 22 L12 20 L10 13 Z" fill="#ff9500" opacity="0.7"/>
  </g>

  <!-- Left decorative bracket -->
  <g opacity="0.4" stroke="#00d4ff" stroke-width="2" fill="none">
    <polyline points="60,60 40,60 40,340 60,340"/>
  </g>

  <!-- AWS badge top -->
  <rect x="80" y="48" width="70" height="24" rx="4" fill="#ff9500" opacity="0.15"/>
  <rect x="80" y="48" width="70" height="24" rx="4" fill="none" stroke="#ff9500" stroke-width="1" opacity="0.6"/>
  <text x="115" y="64" font-size="11" fill="#ff9500" text-anchor="middle" font-weight="bold" opacity="0.9">AWS · FREE</text>

  <!-- Main title -->
  <text x="80" y="140" font-size="52" font-weight="bold" fill="white" opacity="0.95" filter="url(#glow)" letter-spacing="-1">IAM Least-Privilege</text>
  <text x="80" y="198" font-size="52" font-weight="bold" fill="url(#accent)" filter="url(#glow)" letter-spacing="-1">Architecture</text>
  <text x="80" y="256" font-size="52" font-weight="bold" fill="white" opacity="0.95" filter="url(#glow)" letter-spacing="-1">with <tspan fill="url(#orange)">ABAC</tspan></text>

  <!-- Subtitle -->
  <text x="80" y="302" font-size="17" fill="#8ab4c8" letter-spacing="2">CLOUD SECURITY  ·  AWS  ·  ZERO-TRUST IAM</text>

  <!-- Divider line -->
  <line x1="80" y1="320" x2="500" y2="320" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>

  <!-- Tags -->
  <g font-size="12" font-weight="bold">
    <!-- IAM tag -->
    <rect x="80" y="334" width="48" height="22" rx="11" fill="#00d4ff" opacity="0.15"/>
    <rect x="80" y="334" width="48" height="22" rx="11" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <text x="104" y="349" fill="#00d4ff" text-anchor="middle" opacity="0.9">IAM</text>

    <!-- ABAC tag -->
    <rect x="136" y="334" width="52" height="22" rx="11" fill="#00d4ff" opacity="0.15"/>
    <rect x="136" y="334" width="52" height="22" rx="11" fill="none" stroke="#00d4ff" stroke-width="1" opacity="0.5"/>
    <text x="162" y="349" fill="#00d4ff" text-anchor="middle" opacity="0.9">ABAC</text>

    <!-- SCP tag -->
    <rect x="196" y="334" width="46" height="22" rx="11" fill="#ff9500" opacity="0.15"/>
    <rect x="196" y="334" width="46" height="22" rx="11" fill="none" stroke="#ff9500" stroke-width="1" opacity="0.5"/>
    <text x="219" y="349" fill="#ff9500" text-anchor="middle" opacity="0.9">SCP</text>

    <!-- Security tag -->
    <rect x="250" y="334" width="72" height="22" rx="11" fill="#ff9500" opacity="0.15"/>
    <rect x="250" y="334" width="72" height="22" rx="11" fill="none" stroke="#ff9500" stroke-width="1" opacity="0.5"/>
    <text x="286" y="349" fill="#ff9500" text-anchor="middle" opacity="0.9">Security</text>
  </g>

  <!-- Right bracket -->
  <g opacity="0.4" stroke="#00d4ff" stroke-width="2" fill="none">
    <polyline points="1140,60 1160,60 1160,340 1140,340"/>
  </g>

  <!-- Corner accent dots -->
  <circle cx="40" cy="40" r="3" fill="#00d4ff" opacity="0.6"/>
  <circle cx="1160" cy="40" r="3" fill="#00d4ff" opacity="0.6"/>
  <circle cx="40" cy="360" r="3" fill="#ff9500" opacity="0.6"/>
  <circle cx="1160" cy="360" r="3" fill="#ff9500" opacity="0.6"/>
</svg>
